spring.application.name=incident-copilot-api
server.shutdown=graceful

spring.ai.model.chat=${INCIDENT_CHAT_MODEL:none}
# A non-empty default keeps Spring AI auto-configuration from failing startup
# when the service is intentionally running in rule-based fallback mode.
spring.ai.openai.api-key=${OPENAI_API_KEY:test-openai-key}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.2

incident.analysis.ai-enabled=${INCIDENT_AI_ENABLED:true}
incident.analysis.prompt-version=v1
incident.analysis.confidence-threshold=0.65
incident.analysis.max-runbook-snippets=2
incident.analysis.runbook-location=${INCIDENT_RUNBOOK_LOCATION:classpath:/runbooks}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:}

logging.pattern.correlation=[traceId=%X{traceId:-},spanId=%X{spanId:-}]
logging.level.dev.harshith.incidentcopilot=INFO
spring.mvc.problemdetails.enabled=true
