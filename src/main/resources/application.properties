spring.application.name=incident-copilot-api
server.shutdown=graceful

incident.analysis.ai-enabled=${INCIDENT_AI_ENABLED:true}
incident.analysis.prompt-version=v1
incident.analysis.confidence-threshold=0.65
incident.analysis.max-runbook-snippets=2
incident.analysis.runbook-location=${INCIDENT_RUNBOOK_LOCATION:classpath:/runbooks}
incident.analysis.openai-base-url=${OPENAI_BASE_URL:https://api.openai.com}
incident.analysis.default-openai-model=${OPENAI_MODEL:gpt-4o-mini}
incident.analysis.ai-timeout=20s
incident.analysis.credential-store-directory=${INCIDENT_CREDENTIAL_STORE_DIRECTORY:data/credentials}
incident.analysis.master-key-path=${INCIDENT_MASTER_KEY_PATH:data/security/master.key}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:}

logging.pattern.correlation=[traceId=%X{traceId:-},spanId=%X{spanId:-}]
logging.level.dev.harshith.incidentcopilot=INFO
spring.mvc.problemdetails.enabled=true
